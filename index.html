html { color-scheme: light; }
body { background: #f8f5ef; }
#gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f5ef; }
#gate .g-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e6dfd2; border-radius: 16px; padding: 32px 30px 28px; box-shadow: 0 1px 2px rgba(60,50,30,.04), 0 2px 6px rgba(60,50,30,.05); display: flex; flex-direction: column; gap: 18px; }

#gate label { font-size: 13px; font-weight: 500; color: #55524b; display: block; margin-bottom: 6px; }
#gate input { width: 100%; padding: 10px 12px; border: 1px solid #d3c9b8; border-radius: 9px; font: inherit; font-size: 15px; letter-spacing: .04em; outline: none; background: #fff; color: #2a2926; }
#gate input:focus { border-color: #4f86b3; box-shadow: 0 0 0 3px #dde9f3; }
#gate button { width: 100%; padding: 11px 14px; border-radius: 9px; border: 1px solid #8bb5d5; background: #8bb5d5; color: #1e3f5a; font: inherit; font-weight: 600; cursor: pointer; }
#gate button:hover { background: #7aa8cb; }
#gate .g-err { color: #8a3d12; background: #fde4d2; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
#gate .g-foot { font-size: 12px; color: #857f74; }
